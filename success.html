<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Submitted — Clysto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181A;
    --ink-soft:#5B6662;
    --ink-faint:#8A9490;
    --bg:#F8F8F5;
    --primary:#009B8F;
    --primary-dark:#00786F;
    --primary-light:#5FD1C2;
    --paper:#ffffff;
    --line: rgba(20,24,26,0.9);
    --grid: rgba(20,24,26,0.07);
  }

  *{ box-sizing:border-box; }

  html, body{ margin:0; min-height:100%; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    font-family:"DM Sans", sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(0,155,143,0.10), transparent 34%),
      radial-gradient(circle at 92% 4%, rgba(0,155,143,0.08), transparent 32%),
      radial-gradient(circle at 50% 100%, rgba(0,155,143,0.06), transparent 40%),
      var(--bg);
    overflow-x:hidden;
    position:relative;
  }

  /* ============ MASCOT CROWD LAYER ============ */
  .mascot-field{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }

  .mascot{
    position:absolute;
    transform-origin:center bottom;
    animation:bob 5.5s ease-in-out infinite;
    filter:drop-shadow(0 10px 14px rgba(20,24,26,0.10));
  }

  .mascot svg{ display:block; width:100%; height:100%; }

  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(var(--tilt, 0deg)); }
    50%{ transform:translateY(-9px) rotate(var(--tilt, 0deg)); }
  }

  .sparkle{
    position:absolute;
    z-index:0;
    animation:twinkle 2.4s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes twinkle{
    0%,100%{ opacity:.25; transform:scale(.8) rotate(0deg); }
    50%{ opacity:.9; transform:scale(1.15) rotate(20deg); }
  }

  /* individual placements — desktop */
  .m1{ top:4%;  left:3%;   width:96px;  --tilt:-8deg;  animation-delay:.1s; }
  .m2{ top:6%;  left:23%;  width:78px;  --tilt:6deg;   animation-delay:.9s; }
  .m3{ top:2%;  right:26%; width:88px;  --tilt:-5deg;  animation-delay:.4s; }
  .m4{ top:8%;  right:4%;  width:100px; --tilt:9deg;   animation-delay:1.3s; }
  .m5{ top:30%; left:1%;   width:70px;  --tilt:-12deg; animation-delay:.6s; }
  .m6{ top:26%; right:2%;  width:74px;  --tilt:10deg;  animation-delay:1.7s; }
  .m7{ top:56%; left:5%;   width:82px;  --tilt:7deg;   animation-delay:.2s; }
  .m8{ top:60%; right:6%;  width:90px;  --tilt:-9deg;  animation-delay:1s; }
  .m9{ bottom:5%; left:12%; width:92px; --tilt:-6deg;  animation-delay:1.5s; }
  .m10{ bottom:3%; left:36%; width:70px; --tilt:11deg; animation-delay:.8s; }
  .m11{ bottom:6%; right:32%; width:76px; --tilt:-10deg; animation-delay:.3s; }
  .m12{ bottom:4%; right:10%; width:96px; --tilt:8deg;  animation-delay:1.1s; }

  .s1{ top:16%; left:19%; width:20px; }
  .s2{ top:44%; right:20%; width:16px; animation-delay:.6s; }
  .s3{ bottom:22%; left:28%; width:18px; animation-delay:1.1s; }
  .s4{ top:38%; left:9%; width:14px; animation-delay:.3s; }
  .s5{ bottom:16%; right:16%; width:20px; animation-delay:1.4s; }

  @media (max-width:900px){
    .m2, .m5, .m6, .m10, .m11{ display:none; }
    .mascot{ opacity:.85; }
  }

  @media (max-width:600px){
    .m1{ top:1%; left:-2%; width:64px; }
    .m3{ display:none; }
    .m4{ top:2%; right:-4%; width:64px; }
    .m7{ top:48%; left:-4%; width:56px; }
    .m8{ top:52%; right:-4%; width:60px; }
    .m9{ bottom:2%; left:2%; width:60px; }
    .m12{ bottom:1%; right:0%; width:64px; }
    .s1,.s2,.s3,.s4,.s5{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .mascot, .sparkle{ animation:none; }
  }

  /* ============ SUCCESS CARD ============ */
  .success-page{
    width:100%;
    max-width:760px;
    min-height:620px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
  }

  .success-card{
    width:100%;
    max-width:600px;
    text-align:center;
    padding:60px 42px;
    border-radius:28px;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(6px);
    box-shadow:0 28px 80px rgba(20,35,35,0.12), 0 2px 0 rgba(20,35,35,0.03);
    border:1px solid rgba(20,35,35,0.07);
    position:relative;
  }

  .eyebrow-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 14px;
    border-radius:999px;
    background:rgba(0,155,143,0.10);
    border:1px solid rgba(0,155,143,0.25);
    color:var(--primary-dark);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:22px;
  }

  .success-icon{
    width:100px;
    height:100px;
    margin:0 auto 28px;
    border:2px solid var(--primary);
    background:rgba(0,155,143,0.06);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    line-height:1;
    font-weight:400;
    color:var(--primary);
  }

  h1{
    margin:0 0 16px;
    font-family:"Manrope", sans-serif;
    font-size:clamp(32px, 5.6vw, 48px);
    line-height:1.05;
    letter-spacing:-1.4px;
  }

  p{
    max-width:480px;
    margin:0 auto 34px;
    color:var(--ink-soft);
    font-size:16.5px;
    line-height:1.7;
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:190px;
    padding:15px 26px;
    border-radius:12px;
    background:var(--ink);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    transition:transform .2s ease, opacity .2s ease, background .2s ease;
  }

  .back-btn:hover{
    transform:translateY(-2px);
    background:var(--primary-dark);
  }

  @media (max-width:600px){
    body{ padding:18px; }
    .success-card{ padding:46px 22px; }
    .success-icon{ width:84px; height:84px; font-size:44px; }
  }
</style>
</head>
<body>

  <!-- Decorative mascot crowd -->
  <div class="mascot-field" aria-hidden="true">
    <div class="mascot m1"><svg viewBox="0 0 100 140"><use href="#mascot-square-wink"/></svg></div>
    <div class="mascot m2"><svg viewBox="0 0 100 140"><use href="#mascot-marker-thumb"/></svg></div>
    <div class="mascot m3"><svg viewBox="0 0 100 140"><use href="#mascot-brush-heart"/></svg></div>
    <div class="mascot m4"><svg viewBox="0 0 100 140"><use href="#mascot-square-phone"/></svg></div>
    <div class="mascot m5"><svg viewBox="0 0 100 140"><use href="#mascot-marker-wink"/></svg></div>
    <div class="mascot m6"><svg viewBox="0 0 100 140"><use href="#mascot-brush-wave"/></svg></div>
    <div class="mascot m7"><svg viewBox="0 0 100 140"><use href="#mascot-square-wave"/></svg></div>
    <div class="mascot m8"><svg viewBox="0 0 100 140"><use href="#mascot-marker-thumb"/></svg></div>
    <div class="mascot m9"><svg viewBox="0 0 100 140"><use href="#mascot-brush-heart"/></svg></div>
    <div class="mascot m10"><svg viewBox="0 0 100 140"><use href="#mascot-square-wink"/></svg></div>
    <div class="mascot m11"><svg viewBox="0 0 100 140"><use href="#mascot-marker-wink"/></svg></div>
    <div class="mascot m12"><svg viewBox="0 0 100 140"><use href="#mascot-square-wave"/></svg></div>

    <svg class="sparkle s1" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="sparkle s2" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="sparkle s3" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="sparkle s4" viewBox="0 0 24 24"><use href="#spark"/></svg>
    <svg class="sparkle s5" viewBox="0 0 24 24"><use href="#spark"/></svg>
  </div>

  <!-- Symbol defs: reusable mascot art -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

      <!-- sparkle / four-point star -->
      <symbol id="spark" viewBox="0 0 24 24">
        <path d="M12 0 C12 7 13 10 24 12 C13 14 12 17 12 24 C12 17 11 14 0 12 C11 10 12 7 12 0Z" fill="#009B8F"/>
      </symbol>

      <!-- ===== Grid-square headed character ===== -->
      <symbol id="mascot-base-square" viewBox="0 0 100 140">
        <!-- legs -->
        <rect x="38" y="96" width="8" height="26" rx="4" fill="#14181A"/>
        <rect x="55" y="96" width="8" height="26" rx="4" fill="#14181A"/>
        <!-- shoes -->
        <path d="M32 120h16a4 4 0 0 1 4 4v2H30v-2a4 4 0 0 1 2-4Z" fill="#009B8F"/>
        <path d="M49 120h16a4 4 0 0 1 4 4v2H47v-2a4 4 0 0 1 2-4Z" fill="#14181A"/>
        <!-- head -->
        <rect x="22" y="30" width="56" height="56" rx="14" fill="#FBFBF8" stroke="#14181A" stroke-width="3"/>
        <!-- grid texture -->
        <g stroke="#14181A" stroke-opacity="0.10" stroke-width="1.4">
          <line x1="22" y1="47" x2="78" y2="47"/>
          <line x1="22" y1="64" x2="78" y2="64"/>
          <line x1="22" y1="81" x2="78" y2="81"/>
          <line x1="38" y1="30" x2="38" y2="86"/>
          <line x1="54" y1="30" x2="54" y2="86"/>
          <line x1="70" y1="30" x2="70" y2="86"/>
        </g>
        <!-- hair leaves -->
        <path d="M62 32c4-14 20-18 26-12-8 2-12 8-12 8s10-2 16 4c-10 2-16 10-16 10s6 8 2 16c-6-10-16-8-16-8s-4-10 0-18Z" fill="#009B8F" stroke="#046B5E" stroke-width="1.5"/>
      </symbol>

      <symbol id="mascot-square-wink" viewBox="0 0 100 140">
        <use href="#mascot-base-square"/>
        <path d="M36 56c2-2 8-2 10 0" stroke="#14181A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="60" cy="56" r="3" fill="#14181A"/>
        <path d="M42 68c3 3 9 3 12 0" stroke="#14181A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M18 78c-6 2-10 8-8 14" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="9" cy="94" r="4.5" fill="#FBFBF8" stroke="#14181A" stroke-width="2.6"/>
        <path d="M82 78c6 2 10 8 8 14" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
      </symbol>

      <symbol id="mascot-square-wave" viewBox="0 0 100 140">
        <use href="#mascot-base-square"/>
        <circle cx="38" cy="57" r="3" fill="#14181A"/>
        <circle cx="60" cy="57" r="3" fill="#14181A"/>
        <path d="M42 69c3 3 9 3 12 0" stroke="#14181A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M20 80c-10-4-16 2-18 10" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="2" cy="88" r="4.5" fill="#FBFBF8" stroke="#14181A" stroke-width="2.6"/>
        <path d="M80 80c8-8 18-6 22 0" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="94" cy="76" r="4.5" fill="#FBFBF8" stroke="#14181A" stroke-width="2.6"/>
      </symbol>

      <symbol id="mascot-square-phone" viewBox="0 0 100 140">
        <use href="#mascot-base-square"/>
        <path d="M35 56c2-2 8-2 10 0" stroke="#14181A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M57 56c2-2 8-2 10 0" stroke="#14181A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M43 68c3 3 9 3 12 0" stroke="#14181A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M78 76c8 2 12 10 10 18" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <rect x="82" y="90" width="14" height="20" rx="3" fill="#14181A"/>
        <rect x="84" y="93" width="10" height="13" rx="1.4" fill="#5FD1C2"/>
        <path d="M22 80c-6 2-10 8-8 14" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
      </symbol>

      <!-- ===== Marker / pen character ===== -->
      <symbol id="mascot-base-marker" viewBox="0 0 100 140">
        <rect x="38" y="128" width="24" height="6" rx="3" fill="#14181A" opacity=".18"/>
        <rect x="40" y="52" width="20" height="76" rx="9" fill="#FBFBF8" stroke="#14181A" stroke-width="3"/>
        <g stroke="#14181A" stroke-opacity="0.10" stroke-width="1.3">
          <line x1="40" y1="70" x2="60" y2="70"/>
          <line x1="40" y1="88" x2="60" y2="88"/>
          <line x1="40" y1="106" x2="60" y2="106"/>
        </g>
        <rect x="37" y="42" width="26" height="12" rx="3" fill="#14181A"/>
        <path d="M38 12c0-7 5-12 12-12s12 5 12 12v32H38V12Z" fill="#00A897" stroke="#046B5E" stroke-width="2.6"/>
        <ellipse cx="44" cy="12" rx="3.4" ry="7" fill="#5FD1C2" opacity=".7"/>
      </symbol>

      <symbol id="mascot-marker-wink" viewBox="0 0 100 140">
        <use href="#mascot-base-marker"/>
        <path d="M42 25c2-2 6-2 8 0" stroke="#14181A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle cx="58" cy="25" r="2.6" fill="#14181A"/>
        <path d="M46 34c2.5 2.5 7.5 2.5 10 0" stroke="#14181A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <path d="M40 62c-9 0-13 6-12 13" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="26" cy="76" r="4.5" fill="#FBFBF8" stroke="#14181A" stroke-width="2.6"/>
        <path d="M60 62c9 0 13 6 12 13" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
      </symbol>

      <symbol id="mascot-marker-thumb" viewBox="0 0 100 140">
        <use href="#mascot-base-marker"/>
        <circle cx="46" cy="25" r="2.6" fill="#14181A"/>
        <circle cx="54" cy="25" r="2.6" fill="#14181A"/>
        <path d="M46 34c2.5 2.5 7.5 2.5 10 0" stroke="#14181A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <path d="M60 62c10-2 16 3 17 10" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M74 66l3-7a3 3 0 0 1 5 2l-1 5h4a3 3 0 0 1 3 4l-3 9a4 4 0 0 1-4 3h-9a3 3 0 0 1-3-3v-9a3 3 0 0 1 1-2Z" fill="#FBFBF8" stroke="#14181A" stroke-width="2.4"/>
        <path d="M40 62c-9 0-13 6-12 13" stroke="#14181A" stroke-width="3" stroke-linecap="round" fill="none"/>
      </symbol>

      <!-- ===== Paintbrush character ===== -->
      <symbol id="mascot-base-brush" viewBox="0 0 100 140">
        <path d="M46 76l-5 46a3.5 3.5 0 0 0 7 0l2-46Z" fill="#FBFBF8" stroke="#14181A" stroke-width="2.6"/>
        <rect x="40" y="58" width="20" height="20" rx="7" fill="#FBFBF8" stroke="#14181A" stroke-width="3"/>
        <rect x="38" y="48" width="24" height="12" rx="2" fill="#14181A"/>
        <path d="M38 48c1-20 10-34 12-44 3 8 3 16 0 22 6-8 14-10 20-6-8 4-11 10-9 16 6-2 12 2 13 8-8-2-14 2-16 8-4 8-14 10-20-4Z" fill="#00A897" stroke="#046B5E" stroke-width="2.4"/>
      </symbol>

      <symbol id="mascot-brush-heart" viewBox="0 0 100 140">
        <use href="#mascot-base-brush"/>
        <circle cx="45" cy="67" r="2.6" fill="#14181A"/>
        <circle cx="55" cy="67" r="2.6" fill="#14181A"/>
        <path d="M44 74c2.5 2 9.5 2 12 0" stroke="#14181A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M60 68c8-2 13 4 12 11" stroke="#14181A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <path d="M74 72c-2-2-6-1-6 3 0 3 6 7 6 7s6-4 6-7c0-4-4-5-6-3Z" fill="#00A897" stroke="#046B5E" stroke-width="1.6"/>
        <path d="M40 68c-8-2-13 4-12 11" stroke="#14181A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      </symbol>

      <symbol id="mascot-brush-wave" viewBox="0 0 100 140">
        <use href="#mascot-base-brush"/>
        <path d="M43 68c2-2 6-2 8 0" stroke="#14181A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <circle cx="57" cy="68" r="2.6" fill="#14181A"/>
        <path d="M44 75c2.5 2 9.5 2 12 0" stroke="#14181A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M60 68c10-4 18 2 19 10" stroke="#14181A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <circle cx="82" cy="72" r="4" fill="#FBFBF8" stroke="#14181A" stroke-width="2.4"/>
        <path d="M40 68c-8-2-13 4-12 11" stroke="#14181A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      </symbol>

    </defs>
  </svg>

  <main class="success-page">
    <section class="success-card">
      <span class="eyebrow-pill">Ground Zero · Student Founders</span>
      <div class="success-icon">✓</div>
      <h1>Application Submitted!</h1>
      <p>
        Thank you for applying to Ground Zero. We've received your application
        and will review it shortly. Keep an eye on your email for updates!
      </p>
      <a class="back-btn" href="https://clysto-net.vercel.app/">
        Back to Clysto
      </a>
    </section>
  </main>

</body>
</html>
